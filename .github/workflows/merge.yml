name: Merge

on:
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}.${{ github.ref }}
  cancel-in-progress: true

jobs:
  release:
    permissions:
      contents: read
      packages: write
    uses: Worth-NL/ci-workflows/.github/workflows/release-image.yml@main
    with:
      image: ghcr.io/worth-nl/notifynl-antivirus
    secrets: inherit
