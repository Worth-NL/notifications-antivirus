name: PR

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review

# No workflow-level concurrency: it would cancel a running helm upgrade in `deploy`.
permissions:
  contents: read

jobs:
  unit-test:
    runs-on: ubuntu-latest

    concurrency:
      group: ${{ github.workflow }}.${{ github.ref }}.unit-test
      cancel-in-progress: true

    strategy:
      matrix:
        python-version: ["3.13"]

    permissions:
      contents: read
      actions: read
      checks: write

    steps:
      - uses: actions/checkout@v4

      - name: Start ClamAV daemon clamd
        uses: toblux/start-clamd-github-action@v0.2.1

      - name: Ping clamd on TCP port 3310
        run: echo PING | nc localhost 3310

      - name: Ping clamd using the Unix socket
        run: echo PING | nc -U /tmp/clamd.socket

      - uses: Worth-NL/ci-workflows/.github/actions/python-setup@main
        with:
          python-version: ${{ matrix.python-version }}
          cache-dependency-glob: requirements_nl_test.txt

      - uses: Worth-NL/ci-workflows/.github/actions/python-test@main
        env:
          CLAMAV_SERVICE_HOST: localhost

  build:
    if: github.event.pull_request.draft == false
    needs: unit-test
    concurrency:
      group: ${{ github.workflow }}.${{ github.ref }}.build
      cancel-in-progress: true
    permissions:
      contents: read
      packages: write
    uses: Worth-NL/ci-workflows/.github/workflows/build-image.yml@main
    with:
      image: ghcr.io/worth-nl/notifynl-antivirus

  deploy:
    if: github.event.pull_request.draft == false
    needs: build
    permissions:
      contents: read
      pull-requests: write
    uses: Worth-NL/ci-workflows/.github/workflows/deploy-test.yml@main
    with:
      tag: ${{ needs.build.outputs.tag }}
      image-keys: |
        apps.antivirus
        apps.antivirusWorker
      failure-hints: |-
        Check the test env k8s state and logs, and whether the Helm release needs a rollback.

        Most likely causes:
        - ClamAV daemon readiness/connectivity
        - Package visibility
        - ghcr.io credentials expiration or change
    secrets: inherit
